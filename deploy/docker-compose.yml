version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sport-web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - sport-net

  nginx:
    image: nginx:alpine
    container_name: sport-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/static:/var/www/static:ro
    depends_on:
      - web
    networks:
      - sport-net

networks:
  sport-net:
    driver: bridge
